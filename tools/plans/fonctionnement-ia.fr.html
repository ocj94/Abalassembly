</defs><rect width="1600" height="1180" fill="#0b2a4a"/><rect width="1600" height="1180" fill="url(#g2)"/><rect x="18" y="18" width="1564" height="1144" class="trait"/><rect x="26" y="26" width="1548" height="1128" class="fin"/><text x="52" y="66" style="font-size:24px;font-weight:500;letter-spacing:4px">ABALASSEMBLY · IA, LABO, OBSERVATOIRE, WORKERS</text><text x="52" y="90" class="s">Plan de fonctionnement — qui calcule quoi, et comment les améliorations du Labo arrivent jusqu’à l’IA de la partie</text><rect x="40" y="110" width="1000" height="880" rx="6" class="prevu" style="stroke:#5f86b8"/><text x="56" y="132" class="xs" style="letter-spacing:2px">DANS LE NAVIGATEUR · index.html · tout marche hors ligne</text><rect x="1070" y="110" width="500" height="880" rx="6" class="prevu" style="stroke:#5f86b8"/><text x="1086" y="132" class="xs" style="letter-spacing:2px">SUR UN SERVEUR · optionnel (hébergement à choisir)</text><g transform="translate(60,150)"><rect width="240" height="320" rx="4" class="trait"/><text x="14" y="26" class="h">① LA PARTIE</text><line x1="14" y1="37" x2="226" y2="37" class="fin"/><text x="14" y="58" class="s">Plateau 2D / 3D</text><text x="14" y="76" class="s">Le joueur joue son coup</text><text x="14" y="94" class="s"></text><text x="14" y="112" class="lbl">→ demande un coup à l’IA</text><text x="14" y="130" class="lbl">← reçoit le coup joué</text><text x="14" y="148" class="s"></text><text x="14" y="166" class="s">Rien ne part sur Internet</text><text x="14" y="184" class="s">pendant une partie</text><text x="14" y="308" class="xs">plateau, règles : 07, 10</text></g><path d="M300 300 H328" class="fleche"/><path d="M330 330 H302" class="retour"/><g transform="translate(330,150)"><rect width="420" height="320" rx="4" class="trait"/><text x="14" y="26" class="h">② L’IA DU JEU</text><line x1="14" y1="37" x2="406" y2="37" class="fin"/><text x="14" y="58" class="lbl">Niveau 1 à 10 → profondeur + temps maximum</text><text x="14" y="76" class="s">Recherche alpha-bêta, approfondissement itératif :</text><text x="14" y="94" class="s">elle va aussi loin que le temps le permet</text><text x="14" y="112" class="lbl">Fils de calcul : 1 à 4 Web Workers (cœurs − 1)</text><text x="14" y="130" class="s">Table de transposition : 5 % de la mémoire</text><text x="14" y="148" class="s">Livre d’ouvertures (parties humaines, + duels)</text><text x="14" y="166" class="s">Tables de finale 2v2 / 3v2 prouvées</text><text x="14" y="184" class="lbl">Poids de l’évaluation (le « juge ») :</text><text x="14" y="202" class="s">  niveaux 1–3 : poids d’origine</text><text x="14" y="220" class="s">  niveaux 4–10 : Texel ou champion du Labo</text><text x="14" y="308" class="xs">src/main/11-ai-engine-search.js · 13-move-detection-motifs.js</text></g><path d="M750 250 H778" class="fleche"/><path d="M750 380 H778" class="fleche"/><g transform="translate(780,150)"><rect width="240" height="320" rx="4" class="trait"/><text x="14" y="26" class="h">③ OBSERVATOIRE IA</text><line x1="14" y1="37" x2="226" y2="37" class="fin"/><text x="14" y="58" class="s">Panneau à côté du plateau</text><text x="14" y="76" class="s">(en dessous sur téléphone)</text><text x="14" y="94" class="s"></text><text x="14" y="112" class="lbl">Il observe, ne calcule rien</text><text x="14" y="130" class="lbl">en double :</text><text x="14" y="148" class="s">· toutes les 150 ms : prof.,</text><text x="14" y="166" class="s">  nœuds, coupures, coups</text><text x="14" y="184" class="s">  (seulement s’il est ouvert)</text><text x="14" y="202" class="s">· à la fin : « Réflexion IA »</text><text x="14" y="220" class="s">5 onglets, 3 niveaux</text><text x="14" y="308" class="xs">src/main/59-observatoire-ia.js</text></g><rect x="60" y="540" width="960" height="430" rx="4" class="trait" style="stroke-width:2.2"/><text x="76" y="568" class="h">④ LABO IA — améliorer l’IA</text><line x1="76" y1="580" x2="1004" y2="580" class="fin"/><g transform="translate(80,600)"><rect width="290" height="130" rx="4" class="trait"/><text x="14" y="26" class="h">Positions du corpus</text><line x1="14" y1="37" x2="276" y2="37" class="fin"/><text x="14" y="58" class="s">4 580 vraies parties</text><text x="14" y="76" class="s">→ positions calmes,</text><text x="14" y="94" class="s">  dont on connaît le gagnant</text><text x="14" y="118" class="xs">42-labo-positions.js</text></g><g transform="translate(395,600)"><rect width="290" height="130" rx="4" class="trait"/><text x="14" y="26" class="h">Texel</text><line x1="14" y1="37" x2="276" y2="37" class="fin"/><text x="14" y="58" class="s">Trouve les poids qui</text><text x="14" y="76" class="s">devinent le mieux le gagnant</text><text x="14" y="94" class="s">En secondes, sans partie</text><text x="14" y="118" class="xs">43-labo-texel.js</text></g><g transform="translate(710,600)"><rect width="290" height="130" rx="4" class="trait"/><text x="14" y="26" class="h">Auto · champion</text><line x1="14" y1="37" x2="276" y2="37" class="fin"/><text x="14" y="58" class="s">Mutants → tri → confirmation</text><text x="14" y="76" class="s">SPRT par paires (+ SPSA)</text><text x="14" y="94" class="lbl">Adopté seulement s’il gagne</text><text x="14" y="118" class="xs">17-puzzle-…-lab-start.js</text></g><g transform="translate(80,745)"><rect width="290" height="130" rx="4" class="trait"/><text x="14" y="26" class="h">Bancs d’essai</text><line x1="14" y1="37" x2="276" y2="37" class="fin"/><text x="14" y="58" class="s">Styles · niveaux 1–10</text><text x="14" y="76" class="s">Ouvertures → livre (option)</text><text x="14" y="94" class="s">Comme les humains · Contre toi</text><text x="14" y="118" class="xs">44-labo-bancs.js · 45-labo-humains.js</text></g><g transform="translate(395,745)"><rect width="290" height="130" rx="4" class="trait"/><text x="14" y="26" class="h">Tableau de bord</text><line x1="14" y1="37" x2="276" y2="37" class="fin"/><text x="14" y="58" class="s">Totaux, temps de calcul</text><text x="14" y="76" class="s">Poids du champion au fil</text><text x="14" y="94" class="s">du temps · graphiques</text><text x="14" y="118" class="xs">47-labo-tableau.js</text></g><g transform="translate(710,745)"><rect width="290" height="130" rx="4" class="trait"/><text x="14" y="26" class="h">🌐 Réseau de calcul</text><line x1="14" y1="37" x2="276" y2="37" class="fin"/><text x="14" y="58" class="s">Crée des campagnes</text><text x="14" y="76" class="s">duel ou auto-jeu (admin)</text><text x="14" y="94" class="lbl">Branche cet appareil</text><text x="14" y="118" class="xs">58d-reseau-calcul.js</text></g><path d="M370 665 H393" class="fleche"/><path d="M685 665 H708" class="fleche"/><text x="690" y="656" class="xs" text-anchor="end"></text><rect x="80" y="895" width="920" height="58" rx="3" class="fin"/><text x="96" y="919" class="lbl">Fils de calcul du Labo : Web Workers, le même moteur que l’IA du jeu (mêmes coups, mêmes poids)</text><text x="96" y="939" class="xs">Les résultats restent dans ce navigateur (localStorage) : champion, journal des 2 000 dernières parties</text><path d="M540 598 V474" class="retour"/><path d="M790 598 V560 H760 V474" class="retour" style="display:none"/><path d="M855 598 V505 H740 V474" class="retour"/><text x="550" y="512" class="lbl" style="fill:#7fe0c4">poids Texel</text><text x="865" y="520" class="lbl" style="fill:#7fe0c4">champion adopté</text><text x="865" y="535" class="xs" style="fill:#7fe0c4">→ niveaux 4 à 10</text><g transform="translate(1100,150)"><rect width="450" height="330" rx="4" class="trait"/><text x="14" y="26" class="h">⑤ SERVEUR abalassembly-api</text><line x1="14" y1="37" x2="436" y2="37" class="fin"/><text x="14" y="58" class="lbl">Ordonnanceur /ordo</text><text x="14" y="76" class="s">Campagnes : duel (deux poids) ou auto-jeu</text><text x="14" y="94" class="s">1 mission = 1 partie à profondeur fixe</text><text x="14" y="112" class="s">Bail 60 s, signe de vie toutes les 20 s</text><text x="14" y="130" class="lbl">Vérificateur : rejoue la partie et recalcule</text><text x="14" y="148" class="s">3 demi-coups → identiques, sinon refus</text><text x="14" y="166" class="s">Bilan : victoires / nulles / défaites, SPRT</text><text x="14" y="184" class="s">Export de positions (NDJSON / CSV)</text><text x="14" y="202" class="s">Comptes, preuve de travail, MFA admin</text><text x="14" y="318" class="xs">PostgreSQL 16 · Redis 7 · Docker</text></g><path d="M1000 790 H1050 V300 H1098" class="fleche"/><path d="M1098 340 H1060 V830 H1002" class="retour"/><g transform="translate(1100,540)"><rect width="450" height="290" rx="4" class="trait"/><text x="14" y="26" class="h">⑥ WORKERS (exécutants)</text><line x1="14" y1="37" x2="436" y2="37" class="fin"/><text x="14" y="64" class="lbl">● navigateur</text><text x="120" y="64" class="s">onglet Réseau du Labo : téléphone, PC</text><text x="14" y="104" class="lbl">● node</text><text x="120" y="104" class="s">scripts/executant.js sur un PC (ABA_COEURS)</text><text x="14" y="144" class="lbl">● serveur</text><text x="120" y="144" class="s">conteneurs Docker « executant »</text><text x="14" y="184" class="lbl" style="fill:#9fbbe0">○ natif</text><text x="120" y="184" class="s" style="fill:#9fbbe0">moteur compilé (C / Rust), prévu</text><text x="14" y="224" class="lbl" style="fill:#9fbbe0">○ boinc</text><text x="120" y="224" class="s" style="fill:#9fbbe0">bénévoles BOINC, longues missions, prévu</text><text x="14" y="272" class="xs">Chacun : réclamer → jouer → rendre. Débrancher ne perd rien.</text></g><path d="M1280 482 V538" class="fleche"/><path d="M1420 538 V482" class="retour"/><text x="1270" y="514" class="xs" text-anchor="end">mission + bail</text><text x="1430" y="514" class="xs">résultat vérifié</text><g transform="translate(1100,860)"><rect width="450" height="115" rx="4" class="prevu"/><text x="14" y="26" class="h">⑦ RÉSEAU DE NEURONES (prévu)</text><line x1="14" y1="37" x2="436" y2="37" class="fin"/><text x="14" y="58" class="s">Entraîné sur les positions d’auto-jeu</text><text x="14" y="76" class="lbl">Mode « ombre » : comparé au juge,</text><text x="14" y="94" class="s">jamais à sa place</text></g><path d="M1550 420 H1562 V910 H1552" class="fprevu" style="marker-end:url(#pointeP)"/><path d="M1098 950 H1040 V500 H910 V474" class="fprevu" style="marker-end:url(#pointeP)"/><text x="1034" y="492" class="xs" text-anchor="end">en ombre (prévu)</text><text x="800" y="1012" class="lbl" text-anchor="middle">Un seul moteur partout : l’IA du jeu, les fils du Labo, les workers et le vérificateur jouent exactement les mêmes coups (empreinte SHA-256 vérifiée)</text><g transform="translate(52,1035)"><text x="0" y="14" class="h">LÉGENDE</text><path d="M0 34 H50" class="fleche"/><text x="62" y="38" class="s">demande, mission, campagne</text><path d="M0 58 H50" class="retour"/><text x="62" y="62" class="s">résultat, poids améliorés qui reviennent à l’IA</text><path d="M0 82 H50" class="fprevu" style="marker-end:url(#pointeP)"/><text x="62" y="86" class="s">prévu (pas encore construit)</text><text x="0" y="112" class="xs">● en service   ○ prévu   · Le jeu marche sans serveur : ⑤ ⑥ ⑦ servent seulement au calcul partagé.</text></g><g transform="translate(1100,1035)"><rect width="450" height="112" class="trait"/><line x1="0" y1="36" x2="450" y2="36" class="fin"/><text x="12" y="24" class="t">ABALASSEMBLY · FONCTIONNEMENT IA</text><text x="12" y="60" class="xs">Projet</text><text x="82" y="60" class="s">ocj94</text><text x="237" y="60" class="xs">Version</text><text x="307" y="60" class="s">v3.24</text><text x="12" y="94" class="xs">Date</text><text x="82" y="94" class="s">11/11/2026</text><text x="237" y="94" class="xs">Planche</text><text x="307" y="94" class="s">3 / 3</text></g></svg></body></html>
