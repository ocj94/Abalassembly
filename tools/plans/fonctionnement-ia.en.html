</defs><rect width="1600" height="1180" fill="#0b2a4a"/><rect width="1600" height="1180" fill="url(#g2)"/><rect x="18" y="18" width="1564" height="1144" class="trait"/><rect x="26" y="26" width="1548" height="1128" class="fin"/><text x="52" y="66" style="font-size:24px;font-weight:500;letter-spacing:4px">ABALASSEMBLY · AI, LAB, OBSERVATORY, WORKERS</text><text x="52" y="90" class="s">How it works — who computes what, and how the Lab’s improvements reach the AI you play against</text><rect x="40" y="110" width="1000" height="880" rx="6" class="prevu" style="stroke:#5f86b8"/><text x="56" y="132" class="xs" style="letter-spacing:2px">IN THE BROWSER · index.html · everything works offline</text><rect x="1070" y="110" width="500" height="880" rx="6" class="prevu" style="stroke:#5f86b8"/><text x="1086" y="132" class="xs" style="letter-spacing:2px">ON A SERVER · optional (hosting to be chosen)</text><g transform="translate(60,150)"><rect width="240" height="320" rx="4" class="trait"/><text x="14" y="26" class="h">① THE GAME</text><line x1="14" y1="37" x2="226" y2="37" class="fin"/><text x="14" y="58" class="s">2D / 3D board</text><text x="14" y="76" class="s">The player makes a move</text><text x="14" y="94" class="s"></text><text x="14" y="112" class="lbl">→ asks the AI for a move</text><text x="14" y="130" class="lbl">← receives the move played</text><text x="14" y="148" class="s"></text><text x="14" y="166" class="s">Nothing goes over the Internet</text><text x="14" y="184" class="s">during a game</text><text x="14" y="308" class="xs">board, rules: 07, 10</text></g><path d="M300 300 H328" class="fleche"/><path d="M330 330 H302" class="retour"/><g transform="translate(330,150)"><rect width="420" height="320" rx="4" class="trait"/><text x="14" y="26" class="h">② THE GAME AI</text><line x1="14" y1="37" x2="406" y2="37" class="fin"/><text x="14" y="58" class="lbl">Level 1 to 10 → depth + maximum time</text><text x="14" y="76" class="s">Alpha-beta search, iterative deepening:</text><text x="14" y="94" class="s">it goes as deep as time allows</text><text x="14" y="112" class="lbl">Compute threads: 1 to 4 Web Workers (cores − 1)</text><text x="14" y="130" class="s">Transposition table: 5% of memory</text><text x="14" y="148" class="s">Opening book (human games, + duels)</text><text x="14" y="166" class="s">Proven 2v2 / 3v2 endgame tables</text><text x="14" y="184" class="lbl">Evaluation weights (the “judge”):</text><text x="14" y="202" class="s">  levels 1–3: original weights</text><text x="14" y="220" class="s">  levels 4–10: Texel or Lab champion</text><text x="14" y="308" class="xs">src/main/11-ai-engine-search.js · 13-move-detection-motifs.js</text></g><path d="M750 250 H778" class="fleche"/><path d="M750 380 H778" class="fleche"/><g transform="translate(780,150)"><rect width="240" height="320" rx="4" class="trait"/><text x="14" y="26" class="h">③ AI OBSERVATORY</text><line x1="14" y1="37" x2="226" y2="37" class="fin"/><text x="14" y="58" class="s">Panel next to the board</text><text x="14" y="76" class="s">(below it on a phone)</text><text x="14" y="94" class="s"></text><text x="14" y="112" class="lbl">It only watches: nothing is</text><text x="14" y="130" class="lbl">computed a second time:</text><text x="14" y="148" class="s">· every 150 ms: depth,</text><text x="14" y="166" class="s">  nodes, cut-offs, moves</text><text x="14" y="184" class="s">  (only while it is open)</text><text x="14" y="202" class="s">· at the end: “AI reasoning”</text><text x="14" y="220" class="s">5 tabs, 3 levels</text><text x="14" y="308" class="xs">src/main/59-observatoire-ia.js</text></g><rect x="60" y="540" width="960" height="430" rx="4" class="trait" style="stroke-width:2.2"/><text x="76" y="568" class="h">④ AI LAB — improving the AI</text><line x1="76" y1="580" x2="1004" y2="580" class="fin"/><g transform="translate(80,600)"><rect width="290" height="130" rx="4" class="trait"/><text x="14" y="26" class="h">Corpus positions</text><line x1="14" y1="37" x2="276" y2="37" class="fin"/><text x="14" y="58" class="s">4,595 real games</text><text x="14" y="76" class="s">→ quiet positions,</text><text x="14" y="94" class="s">  whose winner is known</text><text x="14" y="118" class="xs">42-labo-positions.js</text></g><g transform="translate(395,600)"><rect width="290" height="130" rx="4" class="trait"/><text x="14" y="26" class="h">Texel</text><line x1="14" y1="37" x2="276" y2="37" class="fin"/><text x="14" y="58" class="s">Finds the weights that</text><text x="14" y="76" class="s">best predict the winner</text><text x="14" y="94" class="s">In seconds, no games played</text><text x="14" y="118" class="xs">43-labo-texel.js</text></g><g transform="translate(710,600)"><rect width="290" height="130" rx="4" class="trait"/><text x="14" y="26" class="h">Auto · champion</text><line x1="14" y1="37" x2="276" y2="37" class="fin"/><text x="14" y="58" class="s">Mutants → screening → confirmation</text><text x="14" y="76" class="s">Paired SPRT (+ SPSA)</text><text x="14" y="94" class="lbl">Adopted only if it wins</text><text x="14" y="118" class="xs">17-puzzle-…-lab-start.js</text></g><g transform="translate(80,745)"><rect width="290" height="130" rx="4" class="trait"/><text x="14" y="26" class="h">Test benches</text><line x1="14" y1="37" x2="276" y2="37" class="fin"/><text x="14" y="58" class="s">Styles · levels 1–10</text><text x="14" y="76" class="s">Openings → book (option)</text><text x="14" y="94" class="s">Like humans · Against you</text><text x="14" y="118" class="xs">44-labo-bancs.js · 45-labo-humains.js</text></g><g transform="translate(395,745)"><rect width="290" height="130" rx="4" class="trait"/><text x="14" y="26" class="h">Dashboard</text><line x1="14" y1="37" x2="276" y2="37" class="fin"/><text x="14" y="58" class="s">Totals, compute time</text><text x="14" y="76" class="s">Champion weights over</text><text x="14" y="94" class="s">time · charts</text><text x="14" y="118" class="xs">47-labo-tableau.js</text></g><g transform="translate(710,745)"><rect width="290" height="130" rx="4" class="trait"/><text x="14" y="26" class="h">🌐 Compute network</text><line x1="14" y1="37" x2="276" y2="37" class="fin"/><text x="14" y="58" class="s">Creates campaigns</text><text x="14" y="76" class="s">duel or self-play (admin)</text><text x="14" y="94" class="lbl">Plugs this device in</text><text x="14" y="118" class="xs">58d-reseau-calcul.js</text></g><path d="M370 665 H393" class="fleche"/><path d="M685 665 H708" class="fleche"/><text x="690" y="656" class="xs" text-anchor="end"></text><rect x="80" y="895" width="920" height="58" rx="3" class="fin"/><text x="96" y="919" class="lbl">Lab compute threads: Web Workers, the same engine as the game AI (same moves, same weights)</text><text x="96" y="939" class="xs">Results stay in this browser (localStorage): champion, log of the last 2,000 games</text><path d="M540 598 V474" class="retour"/><path d="M790 598 V560 H760 V474" class="retour" style="display:none"/><path d="M855 598 V505 H740 V474" class="retour"/><text x="550" y="512" class="lbl" style="fill:#7fe0c4">Texel weights</text><text x="865" y="520" class="lbl" style="fill:#7fe0c4">adopted champion</text><text x="865" y="535" class="xs" style="fill:#7fe0c4">→ levels 4 to 10</text><g transform="translate(1100,150)"><rect width="450" height="330" rx="4" class="trait"/><text x="14" y="26" class="h">⑤ abalassembly-api SERVER</text><line x1="14" y1="37" x2="436" y2="37" class="fin"/><text x="14" y="58" class="lbl">/ordo scheduler</text><text x="14" y="76" class="s">Campaigns: duel (two weight sets) or self-play</text><text x="14" y="94" class="s">1 mission = 1 fixed-depth game</text><text x="14" y="112" class="s">60 s lease, heartbeat every 20 s</text><text x="14" y="130" class="lbl">Verifier: replays the game and recomputes</text><text x="14" y="148" class="s">3 plies → identical, or rejected</text><text x="14" y="166" class="s">Results: wins / draws / losses, SPRT</text><text x="14" y="184" class="s">Position export (NDJSON / CSV)</text><text x="14" y="202" class="s">Accounts, proof of work, admin MFA</text><text x="14" y="318" class="xs">PostgreSQL 16 · Redis 7 · Docker</text></g><path d="M1000 790 H1050 V300 H1098" class="fleche"/><path d="M1098 340 H1060 V830 H1002" class="retour"/><g transform="translate(1100,540)"><rect width="450" height="290" rx="4" class="trait"/><text x="14" y="26" class="h">⑥ WORKERS (executors)</text><line x1="14" y1="37" x2="436" y2="37" class="fin"/><text x="14" y="64" class="lbl">● browser</text><text x="120" y="64" class="s">Lab’s Network tab: phone, PC</text><text x="14" y="104" class="lbl">● node</text><text x="120" y="104" class="s">scripts/executant.js on a PC (ABA_COEURS)</text><text x="14" y="144" class="lbl">● server</text><text x="120" y="144" class="s">“executant” Docker containers</text><text x="14" y="184" class="lbl" style="fill:#9fbbe0">○ native</text><text x="120" y="184" class="s" style="fill:#9fbbe0">compiled engine (C / Rust), planned</text><text x="14" y="224" class="lbl" style="fill:#9fbbe0">○ boinc</text><text x="120" y="224" class="s" style="fill:#9fbbe0">BOINC volunteers, long missions, planned</text><text x="14" y="272" class="xs">Each one: claim → play → return. Unplugging loses nothing.</text></g><path d="M1280 482 V538" class="fleche"/><path d="M1420 538 V482" class="retour"/><text x="1270" y="514" class="xs" text-anchor="end">mission + lease</text><text x="1430" y="514" class="xs">checked result</text><g transform="translate(1100,860)"><rect width="450" height="115" rx="4" class="prevu"/><text x="14" y="26" class="h">⑦ NEURAL NETWORK (planned)</text><line x1="14" y1="37" x2="436" y2="37" class="fin"/><text x="14" y="58" class="s">Trained on self-play positions</text><text x="14" y="76" class="lbl">“Shadow” mode: compared with the judge,</text><text x="14" y="94" class="s">never in its place</text></g><path d="M1550 420 H1562 V910 H1552" class="fprevu" style="marker-end:url(#pointeP)"/><path d="M1098 950 H1040 V500 H910 V474" class="fprevu" style="marker-end:url(#pointeP)"/><text x="1034" y="492" class="xs" text-anchor="end">in shadow (planned)</text><text x="800" y="1012" class="lbl" text-anchor="middle">One engine everywhere: the game AI, the Lab threads, the workers and the verifier play exactly the same moves (SHA-256 fingerprint checked)</text><g transform="translate(52,1035)"><text x="0" y="14" class="h">LEGEND</text><path d="M0 34 H50" class="fleche"/><text x="62" y="38" class="s">request, mission, campaign</text><path d="M0 58 H50" class="retour"/><text x="62" y="62" class="s">result, improved weights going back to the AI</text><path d="M0 82 H50" class="fprevu" style="marker-end:url(#pointeP)"/><text x="62" y="86" class="s">planned (not built yet)</text><text x="0" y="112" class="xs">● in service   ○ planned   · The game works without a server: ⑤ ⑥ ⑦ are only for shared computing.</text></g><g transform="translate(1100,1035)"><rect width="450" height="112" class="trait"/><line x1="0" y1="36" x2="450" y2="36" class="fin"/><text x="12" y="24" class="t">ABALASSEMBLY · HOW THE AI WORKS</text><text x="12" y="60" class="xs">Project</text><text x="82" y="60" class="s">ocj94</text><text x="237" y="60" class="xs">Version</text><text x="307" y="60" class="s">v3.24</text><text x="12" y="94" class="xs">Date</text><text x="82" y="94" class="s">11/11/2026</text><text x="237" y="94" class="xs">Sheet</text><text x="307" y="94" class="s">3 / 3</text></g></svg></body></html>
